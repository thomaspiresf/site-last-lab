<style id="estilo">
/* Mesmo sistema da apresentação do diagnóstico: slide fixo de 1920×1080 num palco que escala. Tema único, escuro. */
:root { color-scheme: dark; --claro: #f3f4f9; --escuro: #121212; --laranja: #ef4b3a; --tinta: #0a0a0a; --suave: #55555d; --cinza: #8d8d96; --linha: #dcdde5; --trilho: #d7dbe2; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
#show { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#palco { position: relative; overflow: hidden; flex: none; }
#palco > div { width: 1920px; height: 1080px; transform-origin: 0 0; }

.apr-slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; display: none; flex-direction: column; gap: 44px; padding: 72px 84px 148px; background: var(--claro); color: var(--tinta); font-family: "Poppins", Arial, sans-serif; }
.apr-slide.on { display: flex; }
.apr-slide.escuro { background: var(--escuro); color: #f7f7f9; }
.apr-titulo h2 { font-size: 88px; font-weight: 400; line-height: 1.25; }
.apr-titulo p { font-size: 36px; font-weight: 300; line-height: 1.4; color: #8d8d96; max-width: 1560px; }
.chapeu { font-size: 30px; font-weight: 300; color: var(--laranja); }

.apr-rodape { position: absolute; inset: 0; color: var(--laranja); pointer-events: none; }
.apr-rodape p { position: absolute; top: 967px; width: 520px; font: 500 18px/21px "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
.apr-rodape .simbolo { position: absolute; left: 1816px; top: 959px; width: 20px; height: 46px; fill: currentColor; }

/* capa e abertura */
.capa { justify-content: space-between; }
.capa .logo { width: 290px; height: 60px; fill: #f7f7f9; }
.capa-txt { display: flex; flex-direction: column; gap: 16px; }
.capa h1 { font-size: 150px; font-weight: 400; line-height: 1.08; letter-spacing: -2px; }
.capa-txt p { font-size: 38px; font-weight: 300; color: #a3a2ad; }
.data { font-size: 24px; font-weight: 300; color: #8d8d96; }
.graf { position: absolute; object-fit: contain; }
.g3 { left: 1064px; top: 347px; width: 745px; rotate: 180deg; }
.abertura { justify-content: center; }
.abertura .chapeu { position: absolute; left: 84px; top: 84px; }
.abertura h1 { font-size: 182px; font-weight: 400; line-height: 1.1; letter-spacing: -3px; }
.g2 { right: 208px; top: 404px; width: 609px; height: 290px; }

/* briefing */
.lista-briefing { flex: 1; display: flex; flex-direction: column; }
.lista-briefing > div { flex: 1; display: grid; grid-template-columns: 340px 1fr; gap: 40px; align-items: center; border-top: 1px solid var(--linha); }
.lista-briefing > div:last-child { border-bottom: 1px solid var(--linha); }
.lista-briefing span { font-size: 30px; font-weight: 300; color: var(--laranja); }
.lista-briefing p { font-size: 30px; line-height: 1.4; font-weight: 400; }

/* tom de voz */
.eixos { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
.polos { display: flex; justify-content: space-between; font-size: 30px; font-weight: 500; margin-bottom: 14px; }
.trilho { position: relative; height: 12px; border-radius: 99px; background: var(--trilho); }
.trilho i { position: absolute; top: 50%; width: 36px; height: 36px; border-radius: 50%; background: var(--laranja); box-shadow: 0 0 0 7px var(--claro); translate: -50% -50%; }

/* critérios */
.dois { flex: 1; display: grid; grid-template-columns: 780px 1fr; gap: 120px; align-items: center; }
.esq { display: flex; flex-direction: column; gap: 28px; }
.esq h2 { font-size: 88px; font-weight: 400; line-height: 1.15; }
.esq p { font-size: 34px; font-weight: 300; line-height: 1.4; color: var(--suave); }
.dir { display: flex; flex-direction: column; gap: 100px; }
.crit { display: grid; grid-template-columns: 130px 1fr; }
.crit b { font-size: 76px; font-weight: 200; line-height: 1; color: var(--laranja); }
.crit h3 { font-size: 42px; font-weight: 600; line-height: 1.2; }
.crit p { font-size: 30px; line-height: 1.4; color: var(--suave); margin-top: 8px; }

/* caminhos */
.nome { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
.marca { display: flex; align-items: baseline; gap: 44px; }
.marca h1 { font-size: 168px; font-weight: 500; line-height: 1.05; letter-spacing: -4px; }
.marca p { font-size: 44px; font-weight: 400; color: var(--laranja); }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--linha); }
.tres > div { display: flex; flex-direction: column; gap: 12px; padding: 28px 44px 28px 44px; border-left: 1px solid var(--linha); }
.tres > div:first-child { padding-left: 0; border-left: 0; }
.tres > div:last-child { padding-right: 0; }
.tres span { font-size: 24px; font-weight: 300; color: var(--laranja); }
.tres p { font-size: 28px; line-height: 1.42; color: var(--suave); }
.tres b { font-weight: 600; color: var(--tinta); }
.tres .frases { color: var(--tinta); font-size: 26px; }
.checks { display: flex; justify-content: space-between; border-top: 1px solid var(--linha); padding-top: 26px; }
.checks > div { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 500; }
.checks em { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: var(--laranja); }
.checks svg { width: 20px; height: 20px; }

/* três caminhos */
.cards { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; align-items: stretch; }
.cards > div { display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 44px; border-radius: 36px; background: #e6e7ee; }
.cards span { font-size: 28px; font-weight: 300; color: var(--laranja); }
.cards h3 { font-size: 76px; font-weight: 500; line-height: 1.15; letter-spacing: -1px; }
.cards p { font-size: 30px; line-height: 1.4; color: var(--suave); }

/* disponibilidade */
.tabela { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.tabela > div { display: grid; grid-template-columns: 24% 28% 28% 20%; align-items: center; padding: 26px 0; border-top: 1px solid var(--linha); font-size: 30px; color: var(--suave); }
.tabela > div:last-child { border-bottom: 1px solid var(--linha); }
.tabela b { font-weight: 600; color: var(--tinta); }
.tabela .cab { border-top: 0; padding: 0 0 18px; font-size: 26px; font-weight: 300; color: var(--laranja); }
.nota { font-size: 28px; font-weight: 300; line-height: 1.4; color: var(--suave); max-width: 1560px; }

/* próximos */
.passos { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 64px; align-items: start; padding-top: 84px; }
.passos > div { display: flex; flex-direction: column; gap: 12px; }
.passos b { font-size: 150px; font-weight: 200; line-height: 1; color: var(--laranja); }
.passos span { font-size: 26px; font-weight: 300; color: #a3a2ad; }
.passos h3 { font-size: 46px; font-weight: 600; line-height: 1.15; }
.passos p { font-size: 30px; font-weight: 300; line-height: 1.4; color: #b9b9c1; }

/* animado: as informações entram em sequência; estático: nada disto se aplica */
@keyframes apr-sobe { from { opacity: 0; translate: 0 28px; } to { opacity: 1; translate: 0 0; } }
@keyframes apr-surge { from { opacity: 0; } to { opacity: 1; } }
@keyframes eixo-vai { from { left: 50%; } }
.animado .apr-slide.on { animation: apr-surge .45s ease both; }
.animado .apr-slide.on .e { animation: apr-sobe .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d, 0s); }
.animado .apr-slide.on .trilho i { animation: eixo-vai 1.1s cubic-bezier(.65,0,.2,1) both; animation-delay: calc(.95s + var(--k, 0) * .16s); }
.animado .apr-slide.on .etapa.oculta { visibility: hidden; animation: none; }
@media (prefers-reduced-motion: reduce) { .animado .apr-slide.on, .animado .apr-slide.on .e, .animado .apr-slide.on .trilho i { animation: none; } }

/* controles */
#barra { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 99px; background: rgba(30,30,32,.92); color: #c9c9d1; font: 13px/1 system-ui, sans-serif; transition: opacity .3s; }
#show.quieto + #barra:not(:focus-within) { opacity: 0; }
#barra button { padding: 8px 12px; border: 0; border-radius: 99px; background: none; color: inherit; font: inherit; cursor: pointer; }
#barra button:hover { background: #3a3a3e; color: #fff; }
#barra button:focus-visible { outline: 2px solid var(--laranja); }
#barra button[aria-pressed="true"] { background: #f7f7f9; color: #111; }
#conta { padding: 0 6px; font-variant-numeric: tabular-nums; }

</style>
</head>

<template id="casca"><div id="show"><div id="palco"><div id="tela"></div></div></div>
<div id="barra">
  <button id="ant" aria-label="Slide anterior">←</button><span id="conta"></span><button id="prox" aria-label="Próximo slide">→</button>
  <button id="mAnim" aria-pressed="true">Animado</button><button id="mEst" aria-pressed="false">Estático</button>
  <button id="bTela">Tela cheia</button>
  </div>
</template>

<section class="apr-slide " id="briefing">
<div class="apr-titulo"><h2>O que entendemos</h2><p>Recapitulando o briefing</p></div><div class="lista-briefing seq"><div><span>A ideia</span><p>Um e-commerce que já começa com cara de marca — Instagram e site próprio, além dos marketplaces.</p></div><div><span>O que vende</span><p>O que estiver em alta. O mix muda a qualquer momento — o nome não pode prender a marca a um produto.</p></div><div><span>Para quem</span><p>Quem compra no marketplace: busca praticidade e bom preço, compara avaliações e confia em quem passa segurança.</p></div><div><span>Tom de voz</span><p>Próximo e confiável. Fala simples, que resolve a vida do cliente — nunca “só promoção”.</p></div><div><span>O desafio</span><p>Ser neutra sem ser genérica: universal para vender qualquer produto, com personalidade para ser lembrada na segunda compra.</p></div></div>

<section class="apr-slide " id="tom">
<div class="apr-titulo"><h2>Onde a marca se posiciona</h2><p>Cada eixo vem do briefing que você aprovou</p></div><div class="eixos seq"><div class="eixo" style="--k:0"><div class="polos"><span>Formal</span><span>Descontraído</span></div><div class="trilho"><i style="left:55%"></i></div></div><div class="eixo" style="--k:1"><div class="polos"><span>Sério</span><span>Divertido</span></div><div class="trilho"><i style="left:45%"></i></div></div><div class="eixo" style="--k:2"><div class="polos"><span>Técnico</span><span>Simples</span></div><div class="trilho"><i style="left:80%"></i></div></div><div class="eixo" style="--k:3"><div class="polos"><span>Exclusivo</span><span>Acessível</span></div><div class="trilho"><i style="left:75%"></i></div></div><div class="eixo" style="--k:4"><div class="polos"><span>Impulsivo</span><span>Confiável</span></div><div class="trilho"><i style="left:78%"></i></div></div></div>

<section class="apr-slide " id="criterios">
<div class="dois"><div class="esq"><h2>O que um bom nome precisa ter</h2><p>Mais do que uma palavra bonita, um bom naming reúne três qualidades e todos os caminhos a seguir passam por elas.</p></div><div class="dir seq"><div class="crit"><b>01</b><div><h3>Intencional</h3><p>Carrega um significado alinhado ao que a marca quer dizer.</p></div></div><div class="crit"><b>02</b><div><h3>Memorável</h3><p>Curto e fácil de lembrar, falar e escrever — e livre para registrar.</p></div></div><div class="crit"><b>03</b><div><h3>Sonoro</h3><p>Soa bem, é fluido e agradável, neutro e versátil para qualquer produto.</p></div></div></div></div>

<script type="application/json" id="textos">{"briefing:3":"Um e-commerce que já começa com cara de marca, Instagram e site próprio, além dos marketplaces.","briefing:5":"O que estiver em alta. O mix muda a qualquer momento, o nome não pode prender a marca a um produto.","briefing:9":"Próximo e confiável. Fala simples, que resolve a vida do cliente.","criterios:1":"Quando criamos um nome para uma marca, ele precisa ser mais do que apenas uma palavra bonita. Um bom naming deve possuir três características essenciais:","criterios:4":"Precisa carregar um significado \u003cbr>alinhado com os valores da marca.","criterios:7":"Deve ser fácil de lembrar e pronunciar.","criterios:10":"Deve soar bem, ser fluido e agradável ao ouvir","ruff:2":"Farejamos boas oportunidades.","multico:4":"De \u003cb>multi\u003c/b>: diversidade, variedade, amplitude. Diz que ali cabe de tudo, um universo de descobertas num lugar só.","caminhos:1":"Não é uma lista de nomes soltos, são três territórios distintos, cada um com um jeito próprio de falar com o cliente. Três personalidades para a mesma loja."}</script>

<script id="app">
(() => {
  const CHAVE = "apr-modo";
  const $ = (id) => document.getElementById(id);

  document.body.append($("casca").content.cloneNode(true));
  const show = $("show"), palco = $("palco"), tela = $("tela");
  tela.append($("base").content.cloneNode(true));
  const slides = [...tela.querySelectorAll(".apr-slide")];

  // cada texto do slide tem uma chave fixa; só o que foi alterado fica guardado em #textos
  const TEXTOS = "h1,h2,h3,p,.chapeu,.lista-briefing span,.polos span,.tres span,.checks span,.cards span,.tabela span,.crit b,.passos b,.passos span";
  const salvos = JSON.parse($("textos").textContent || "{}");
  slides.forEach((s) => [...s.querySelectorAll(TEXTOS)].filter((e) => !e.closest(".apr-rodape")).forEach((e, n) => {
    const v = salvos[`${s.id}:${n}`]; if (v !== undefined) e.innerHTML = v;
  }));
  const ler = () => { try { return localStorage.getItem(CHAVE) !== "estatico"; } catch { return true; } };
  const gravar = (v) => { try { localStorage.setItem(CHAVE, v ? "animado" : "estatico"); } catch { /* sem armazenamento */ } };
  const inicio = location.hash.slice(1);
  let i = Math.max(0, slides.findIndex((s) => s.id === inicio));
  let animado = ler();

  // cada bloco do slide entra na sua vez: os filhos diretos e, nas listas (.seq), item por item
  slides.forEach((s) => {
    let n = 0;
    const marca = (el) => { el.classList.add("e"); el.style.setProperty("--d", `${(.1 + n++ * .11).toFixed(2)}s`); };
    const anda = (el) => [...el.children].forEach((f) => {
      if (f.classList.contains("apr-rodape")) return;
      if (f.classList.contains("seq")) [...f.children].forEach(marca);
      else if (f.querySelector(":scope > .seq, :scope > * > .seq") || f.classList.contains("nome") || f.classList.contains("dois")) anda(f);
      else marca(f);
    });
    anda(s);
  });

  // slides que se revelam a cada clique, só no modo animado: o slide abre sem os itens e cada clique traz um
  const ETAPAS = { briefing: ".lista-briefing > div", criterios: ".crit" };
  const etapas = (k) => (ETAPAS[slides[k].id] ? [...slides[k].querySelectorAll(ETAPAS[slides[k].id])] : []);
  slides.forEach((_, k) => etapas(k).forEach((el) => { el.classList.add("etapa"); el.style.setProperty("--d", "0s"); }));
  let passo = etapas(i).length;

  const medir = () => {
    const l = Math.min(innerWidth, innerHeight * 16 / 9);
    palco.style.width = `${l}px`; palco.style.height = `${l * 9 / 16}px`;
    tela.style.transform = `scale(${l / 1920})`;
  };
  const mostrar = () => {
    slides.forEach((s, k) => s.classList.toggle("on", k === i));
    show.classList.toggle("animado", animado);
    etapas(i).forEach((el, n) => el.classList.toggle("oculta", n >= passo));
    $("conta").textContent = `${i + 1} / ${slides.length}`;
    $("mAnim").setAttribute("aria-pressed", animado); $("mEst").setAttribute("aria-pressed", !animado);
  };
  const ir = (d) => {
    const total = animado ? etapas(i).length : 0;
    if (d === 1 && passo < total) { passo++; mostrar(); return; }
    if (d === -1 && total && passo > 0) { passo--; mostrar(); return; }
    const y = Math.max(0, Math.min(slides.length - 1, i + d));
    if (y !== i) { i = y; passo = d === 1 ? 0 : etapas(i).length; mostrar(); } // voltando, o slide já aparece completo
  };
  const modo = (v) => { animado = v; gravar(v); passo = etapas(i).length; slides[i].classList.remove("on"); void tela.offsetWidth; mostrar(); };
  const telaCheia = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.())?.catch?.(() => {});

  $("ant").onclick = () => ir(-1); $("prox").onclick = () => ir(1);
  $("mAnim").onclick = () => modo(true); $("mEst").onclick = () => modo(false);
  $("bTela").onclick = telaCheia;
  show.addEventListener("click", () => ir(1));
  addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && e.target.tagName === "BUTTON") return;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) ir(1);
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) ir(-1);
    else if (e.key === "a" || e.key === "A") modo(!animado);
    else if (e.key === "f" || e.key === "F") telaCheia();
  });
  let t;
  const acorda = () => { show.classList.remove("quieto"); clearTimeout(t); t = setTimeout(() => show.classList.add("quieto"), 2500); };
  addEventListener("mousemove", acorda); acorda();
  addEventListener("resize", medir);
  medir(); mostrar();
})();
</script>
